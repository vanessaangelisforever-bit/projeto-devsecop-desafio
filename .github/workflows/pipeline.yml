name: 🔐 Pipeline DevSecOps

on: .githut/workflows/<seu ficheiro>.yml
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ────────────────────────────────────────────────────────────────
  # JOB 1 — Build, segurança e assinatura do artefato
  # ────────────────────────────────────────────────────────────────
  build:
    name: Build, Segurança e Assinatura
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔐 Inserir Secrets no JavaScript
        run: |
          echo "Nenhum segredo a ser inserido no código"

      - name: ⚙️ Build
        run: |
          echo "Verificando arquivos..."
          ls src/
          echo "Build OK!"

      # Secrets Scanning com Gitleaks
      - name: 🔑 Secrets Scanning
        uses: gitleaks/gitleaks-action@v2

      # SAST com Semgrep
      - name: 🔍 SAST - Semgrep
        run: |
          pip install semgrep
          semgrep scan --config auto src/

      # SCA com Grype
      - name: 📦 SCA - Grype
        run: |
          npm install --package-lock-only
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sudo sh -s -- -b /usr/local/bin
          grype dir:./ --fail-on high

      # ── Empacota o site em um artefato tar
      - name: 📦 Empacotar artefato do site
        run: |
          tar \
            --dereference --hard-dereference \
            -C src \
            -cvf artifact.tar \
            --exclude=.git --exclude=.github \
            .

      # ── Calcula o hash do artefato
      - name: 🔢 Hash do artefato
        run: |
          digest=$(sha256sum artifact.tar | awk '{print $1}')
          echo "$digest" > artifact.tar.sha256
          echo "SHA256: $digest"

      - name: ✍️ Instalar Cosign
        uses: sigstore/cosign-installer@v3

      # Assina o artefato gerando o bundle .json esperado
      - name: ✍️ Assinar artefato
        run: |
          cosign sign-blob artifact.tar --bundle artifact.sigstore.json --yes

      # ── Publica o artefato + bundle de assinatura para o próximo job
      - name: ⬆️ Upload do artefato assinado
        uses: actions/upload-artifact@v4
        with:
          name: site-artefato
          path: |
            artifact.tar
            artifact.tar.sha256
            artifact.sigstore.json

  # ────────────────────────────────────────────────────────────────
  # JOB 2 — Verifica a assinatura e faz o deploy
  # ────────────────────────────────────────────────────────────────
  deploy:
    name: Verificação e Deploy
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: ⬇️ Baixar o artefato assinado
        uses: actions/download-artifact@v4
        with:
          name: site-artefato

      - name: ✍️ Instalar Cosign
        uses: sigstore/cosign-installer@v3

      # Usa o Cosign para validar assinatura do artefato
      - name: 🔎 Verificar assinatura do artefato
        run: |
          cosign verify-blob artifact.tar \
            --bundle artifact.sigstore.json \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          echo "Assinatura válida — artefato íntegro e autêntico."

      # Descompacta o site para publicar
      - name: 📂 Extrair site verificado
        run: |
          mkdir -p site
          tar -xvf artifact.tar -C site

      - name: 🌐 Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload de páginas
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Publicar no Github Pages
        id: deployment
        uses: actions/deploy-pages@v4
